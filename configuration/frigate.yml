mqtt:
  host: "{MQTT_HOST}"
  user: "{MQTT_USER}"
  password: "{MQTT_PASSWORD}"

go2rtc:
  streams:
    tapo_main:
      - rtsp://{CAMERA_USER}:{CAMERA_PASSWORD}@{CAMERA_IP}:554/stream1 # Main stream.
    tapo_sub:
      - rtsp://{CAMERA_USER}:{CAMERA_PASSWORD}@{CAMERA_IP}:554/stream2 # Sub stream.

cameras:
  main_door:
    ffmpeg:
      hwaccel_args: preset-vaapi
      inputs:
        - path: rtsp://127.0.0.1:8554/tapo_main
          roles:
            - record
        - path: rtsp://127.0.0.1:8554/tapo_sub
          roles:
            - detect
    detect:
      enabled: False  # Standby: activated dynamically via MQTT
      width: 640
      height: 360
      fps: 5
    objects:
      track:
        - person
    zones:
      entrance_zone:
        coordinates: 10,10, 600,10, 600,300, 10,300
    motion:
      mask: 0,0, 100,0, 100,100, 0,100