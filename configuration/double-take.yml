mqtt:
  host: ${MQTT_HOST}
  topic: frigate/events
  user: ${MQTT_USER}
  password: ${MQTT_PASSWORD}

frigate:
  url: http://frigate:5000
  attempts:
    run: 15           # 15 rilevamenti per identificare la persona.
    delay: 0.2       # Si analizza 1 frame ogni 200ms.

detectors:
  compreface:
    url: http://compreface-front-end:80
    key: ${COMPREFACE_API_KEY}
    timeout: 10
    det_prob_threshold: 0.8
    recognition_prob_threshold: 0.8

cameras:
  main_door:
    masks:
      - coordinates: 0,0, 100,0, 100,100, 0,100
    zones:
      - entrance_zone
    detect:
      min_area: 5000
