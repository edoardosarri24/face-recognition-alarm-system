# ==============================================================================
# HOME ASSISTANT AUTOMATIONS - FACE RECOGNITION ALARM SYSTEM (FRAS)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. ATTIVAZIONE: Nessuno a casa (zone.home < 1)
# ------------------------------------------------------------------------------
alias: "allarme_on"
description: "Accende la telecamera e abilita il rilevamento Frigate quando nessuno è a casa"
trigger:
  - platform: numeric_state
    entity_id: zone.home
    below: 1
action:
  - action: switch.turn_on
    target:
      entity_id: switch.camera_ingresso
  - delay: "00:00:03"
  - action: mqtt.publish
    data:
      topic: "frigate/main_door/detect/set"
      payload: "ON"
  - action: mqtt.publish
    data:
      topic: "frigate/main_door/recordings/set"
      payload: "ON"
  - action: notify.notify
    data:
      message: "Allarme: ON."


# ------------------------------------------------------------------------------
# 2. DISATTIVAZIONE: Almeno una persona a casa (zone.home > 0)
# ------------------------------------------------------------------------------
alias: "allarme_off"
description: "Spegne il rilevamento Frigate e la telecamera quando qualcuno è a casa"
trigger:
  - platform: numeric_state
    entity_id: zone.home
    above: 0
action:
  # 1. Spegne rilevamento e registrazioni in Frigate
  - action: mqtt.publish
    data:
      topic: "frigate/main_door/detect/set"
      payload: "OFF"
  - action: mqtt.publish
    data:
      topic: "frigate/main_door/recordings/set"
      payload: "OFF"
  # 2. Spegne la telecamera Tapo (stop RTSP e Wi-Fi)
  - action: switch.turn_on
    target:
      entity_id: switch.camera_ingresso
  - action: notify.notify
    data:
      message: "Allarme: OFF."
